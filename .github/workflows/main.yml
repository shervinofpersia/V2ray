name: Auto Fetch and Remark V2ray Configs

on:
  schedule:
    # اجرای خودکار هر 15 دقیقه
    - cron: '*/15 * * * *'
  workflow_dispatch: # امکان اجرای دستی ورکفلو از تب Actions در گیت‌هاب

permissions:
  contents: write # دادن مجوز ثبت تغییرات به بات گیت‌هاب

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Python Script
      run: python fetch_configs.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # بررسی اینکه آیا فایل تغییر کرده است یا خیر تا از کامیت‌های بیهوده جلوگیری شود
        if git status --porcelain | grep -q "sub.txt"; then
          git add sub.txt
          git commit -m "updated 15 minutes ago"
          git push origin main
        else
          echo "No changes detected in sub.txt"
        fi
